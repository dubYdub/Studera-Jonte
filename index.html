<script>
const data = {
  "DEL 1: LAGAR": [
    {q:"Vad innehaller SoL och vad finns den till for?",a:"Socialtjanstlagen (SoL) reglerar kommunernas skyldighet att ge stod och hjalp till invanare som behover det. Syftar till frivillighet, helhetssyn och att starka den enskildes sjalvstandighet."},
    {q:"Vad innehaller HSL och vad finns den till for?",a:"Halso- och sjukvardslagen (HSL) anger mal och krav for halso- och sjukvarden. Varden ska bedrivas med respekt for alla manniskors lika varde. Regioner ansvarar for halso- och sjukvard."},
    {q:"Vad innehaller LSS och vad finns den till for?",a:"Lagen om stod och service till vissa funktionshindrade ger ratt till stod for personer med stora och varaktiga funktionsnedsattningar. Mal: gott liv med delaktighet och sjalvbestammande."},
    {q:"Vad innebar Lex Sara?",a:"Skyldigheten att anmala och utreda missforhallanden i socialtjansten och LSS. All personal ar skyldig att rapportera. Syftar till att skydda brukare och forbattra kvaliteten."},
    {q:"Vad innebar Lex Maria?",a:"Halso- och sjukvarden ska utreda och anmala handelser som medffort eller hade kunnat medfora allvarlig vardskada till IVO. Mal: lara av misstag och forhindra upprepning."},
    {q:"Vad reglerar Offentlighets- och sekretesslagen?",a:"Allmanhetens ratt att ta del av offentliga handlingar, och skyddet av uppgifter om enskildes halsa, ekonomi och personliga forhallanden. Sekretess galler inom halso- och sjukvard och socialtjanst."},
    {q:"Vad reglerar Smittskyddslagen?",a:"Skydda befolkningen mot smittsamma sjukdomar. Reglerar anmalningspliktig smitta, smittspaning, isolering och behandling. Personal har anmalningsplikt for vissa sjukdomar."},
    {q:"Vad innebar delegering och vilka krav finns?",a:"En legitimerad yrkesutovare overlater en arbetsuppgift till annan person.\n>> Mottagaren maste ha kompetens\n>> Ska vara skriftlig och tidsbegransad (max 1 ar)\n>> Deleganten ansvarar for kontroll av att uppgiften utfors ratt"},
    {q:"Ge exempel pa viktiga statliga myndigheter.",a:">> Socialstyrelsen – kunskapsstyrning, foreskrifter\n>> IVO – tillsyn av vard och omsorg\n>> Folkhalsmyndigheten – folkhalsa och smittskydd\n>> Lakemedelsverket – godkanner lakemedel\n>> E-halsomyndigheten – digitala halsol osningar"},
    {q:"Vad innebar oppenvard och slutenvard?",a:"Oppenvard: patienten besoker varden utan att ligga inne.\nEx: vardcentral, psykiatrimottagning.\n\nSlutenvard: patienten ar inlagd och overnatter.\nEx: sjukhusavdelning, IVA, forlossning."},
    {q:"Ge exempel pa yrkesgrupper i vard och omsorg.",a:">> Lakare, sjukskoterska, underskoterska\n>> Fysioterapeut, arbetsterapeut\n>> Psykolog, kurator, logoped, dietist\n>> Barnmorska, biomedicinsk analytiker"},
    {q:"Forklara: helhetssyn, tillganglighet, kontinuitet, KASAM, salutogent forhallningssatt.",a:"Helhetssyn – se hela manniskan: fysiskt, psykiskt, socialt, andligt\nTillganglighet – vard ska vara latt att na for alla\nKontinuitet – samma personal och sammanhangande vard over tid\nKASAM – Begriplighet + Hanterbarhet + Meningsfullhet\nSalutogent – fokus pa friskfaktorer och resurser"},
    {q:"Vad innebar folkhalsa och vilka ar malen?",a:"Folkhalsa = hela befolkningens halsotillstand.\nNationellt: jamlik halsa och goda livsvillkor for alla.\nInternationellt: WHOs mal om halsa for alla, Agenda 2030."},
    {q:"Vilka ar de vanligaste folksjukdomarna?",a:"Folksjukdom = drabbar stor del av befolkningen.\n>> Hjart-karlsjukdomar\n>> Cancer\n>> Diabetes typ 2\n>> Psykisk ohalsa (depression, angst)\n>> KOL, allergi/astma, reumatiska sjukdomar"},
    {q:"Forklara friskfaktorer och riskfaktorer.",a:"Friskfaktorer: god somn, fysisk aktivitet, socialt stod, meningsfullt arbete, bra kost.\nRiskfaktorer: rokning, alkohol, stillasittande, stress, dalig kost, overvikt, ensamhet."},
    {q:"Forklara KASAM och hur det forklarar halsa.",a:"KASAM = Kansla Av SAMmanhang (Aaron Antonovsky).\n>> Begriplighet – forsta sin situation\n>> Hanterbarhet – ha resurser att klara det\n>> Meningsfullhet – kanna att det ar vart att engagera sig\nHog KASAM = battre halsa och motstandskraft mot stress."},
    {q:"Vad ar skillnaden mellan etik och moral?",a:"Moral: de faktiska varderingar och normer som styr ens handlande i praktiken.\nEtik: den vetenskapliga och filosofiska reflektionen av moral – 'vad ar ratt?' pa ett systematiskt plan."},
    {q:"Vilka ar de 4 etiska grundprinciperna?",a:">> Autonomiprincipen – respektera patientens sjalvbestammande\n>> Godhetsprincipen – gora gott for patienten\n>> Icke-skadaprincipen – undvika att skada\n>> Rattviseprincipen – behandla lika och fordela rattvist"},
    {q:"Vad innebar ett etiskt dilemma? Ge exempel.",a:"Situation dar etiska principer konfliktar utan ett sjalvklart ratt svar.\nEx: patient vagrar blodtransfusion av religiosa skal (autonomi vs godhet).\nEx: dement patient vill ga ut ensam (autonomi vs sakerhet)."},
    {q:"Forklara valfardsteknik och e-halsa.",a:"Valfardsteknik: digital teknik som stodjer aldre/funktionsnedsatta att leva sjalvstandigt.\nEx: GPS-larm, robotdammsugare, lakemedelspaminnare.\nE-halsa: digitala verktyg i sjukvard – digitala journaler, videobesok, sjalvmonitorering."},
  ],
  "DEL 2: SJUKDOMAR": [
    {q:"Vilka symtom kan man ha vid en fraktur?",a:">> Smarta och omhet pa platsen\n>> Svullnad och blamarke\n>> Felstallning/deformitet\n>> Rorelseinskrankning\n>> Krepitationer (knastrande ljud)\n>> Hoftnara: benet forkortat och utatoroterat"},
    {q:"Vad ar symtom for artros, osteoporos och vad ar skillnaden?",a:"Artros: ledvark (varre vid rorelse), stelhet, knappningar, svullnad. Vanligast i kna, hoft, hander.\nOsteoporos: tyst sjukdom utan symtom forran fraktur uppstar. Kotkompressioner ger ryggsmarta och minskad langd."},
    {q:"Vad ar skillnaden mellan objektiva och subjektiva symtom?",a:"Subjektiva: upplevelser bara patienten kanner – smarta, illamaende, yrsel, trotthet.\nObjektiva: observerbara eller matbara fynd – feber (matt), svullnad, blodtryck, andningsljud."},
    {q:"Forklara inspektion, auskultation och palpation.",a:"Inspektion: se – betrakta utseende, rorelser, hud, hallning.\nAuskultation: lyssna – med stetoskop pa hjarta, lungor, tarmljud.\nPalpation: kanna – trycka pa kroppen for att bedoma organstorlek, omhet, resistenser."},
    {q:"Vilka symtom far du vid hjartinfarkt?",a:">> Ihallande tryck/klamkansla i brostet (>20 min)\n>> Smarta stralar till arm, kake, rygg, hals\n>> Illamaende, kallsvett, blekhet\n>> Andnod, angest\n>> Kvinnor: atypiska symtom (trotthet, magont)"},
    {q:"Vilka symtom far du vid karlkramp? Skillnad mot infarkt?",a:"Karlkramp: brostsmarta vid anstrangning/kyla, forsvinner inom 15 min med vila eller nitroglycerin.\nHjartinfarkt: smarta kvarstaar >20 min, forsvinner INTE med vila. Hjartmuskel skadas permanent."},
    {q:"Vilka symtom far du vid hjartsvikt?",a:">> Andnod vid anstrangning och liggande (ortopne)\n>> Odem i ben och anklar\n>> Trotthet, orkesloshet\n>> Nattlig hosta\n>> Viktokni ng (vatskereention)"},
    {q:"Vilka symtom far du vid DVT?",a:"Smarta, svullnad, rodnad och varme i underbenet.\nRisk: blodpropp kan lossna – lungemboli – plotslig andnod, brostsmarta, hemoptys."},
    {q:"Vilka symtom tyder pa lunginflammation (pneumoni)?",a:"Hog feber, frossa, hosta med slem, andnod, brostsmarta, trotthet.\nAldre: ofta forvirring, trotthet, aptitloshet – atypiska symtom!\nViktig atgard: regelbunden lageskandring for att underlatta sekretdranage."},
    {q:"Vilka symtom vid KOL?",a:">> Kronisk hosta med slem (morgonhosta)\n>> Andnod vid anstrangning (okar successivt)\n>> Pipande andning\n>> Frekventa luftvagsinfektioner\nOrsakas nast an alltid av rokning."},
    {q:"Vilka symtom far du vid lungodem?",a:"Plotslig svar andnod, rosslande andning, angest, blaaktig hudton, hosta med rosa skum. Patienten sitter rakt upp for att kunna andas. AKUT – livshotande tillstand. Ring 112."},
    {q:"Vilka symtom far du vid stroke? Beskriv AKUT-testet.",a:"AKUT:\nA – Ansikte hanger/sned mun\nK – Kraftloshet i arm/ben\nU – Uttal svart/forvirrad\nT – Tid – ring 112 direkt!\n\nAven: plotslig huvudvark, synbortfall, balansproblem."},
    {q:"Vilka ar de vanligaste symtomen pa Parkinsons?",a:">> Skakningar (tremor) i vila\n>> Stelhet i muskler (rigiditet)\n>> Langsamma rorelser (bradykinesi)\n>> Balansproblem och fallrisk\n>> Litet skrivet, lag rost, maskansikte"},
    {q:"Vilka symtom far du vid ett epileptiskt anfall?",a:"Grand mal: medvetslosi het, kramper, cyanos, urininkontinens, trotthet efterat.\nAbsens: kortvarig franvaro, tomblickt.\nAtgard: hall personen saker, lagg i framsupa sidolage efter anfallet."},
    {q:"Vad ar UVI och vilka symtom?",a:"Sveda/smarta vid miktion, tata trangningar, grumlig/illaluktande urin.\nOvre UVI (pyelonefrit): feber, frossa, flanksmarta.\nAldre: ofta forvirring, trotthet, fallrisk – inga klassiska symtom!"},
    {q:"Vilka symtom kan ses vid prostataforstoring och njurinsufficiens?",a:"Prostata: tata trangningar, svag strale, svart att kissa, nattliga miktioner, urinretention.\nNjurinsufficiens: trotthet, odem, hogt blodtryck, illamaende, klada, minskad urinproduktion."},
    {q:"Beskriv smittkedjan och dess delar.",a:">> Smitkalla – det infekterade (manniska, djur, miljo)\n>> Smittamne – mikroorganismen\n>> Smittavag – luft, kontakt, droppar, blod, fekal-oral\n>> Smittport – mun, hud, slemhinnor\n>> Mottaglig individ\nBryta ett led = stoppa smittspridning."},
    {q:"Vad ingar i basala hygienrutiner?",a:">> Handhygien – handtvatt och/eller handdesinfektion\n>> Skyddshandskar vid kontakt med blod/kroppsvaetskor\n>> Skyddsrock vid risk for kontamination\n>> Munskydd/visir vid risk for stank\n>> Rent till smutsigt – arbeta systematiskt\n>> Korrekt avfallshantering"},
    {q:"Vad innebar resistenta och multiresistenta bakterier?",a:"Resistenta: klarar sig mot antibiotika som normalt dodar dem.\nMultiresistenta (MRSA, VRE, ESBL): resistenta mot FLERA antibiotika – svar att behandla.\nViktig atgard: ratt antibiotikaanvandning och strikta hygienrutiner."},
    {q:"Beskriv ren saromlaggning och hur man forebygger trycksaar.",a:"Ren saromlaggning: icke-steril teknik, rena handskar, rent material. Anvands vid ytliga kroniska sar.\nTrycksaar vanligast: halar, sacrum, hoftkammar, armbagar.\nForebygg: lageskandring var 2:e timme, avlastningsmadras, god nutrition, hudvard."},
  ],
  "DEL 3: KONTROLLER": [
    {q:"Forklara kontroll av andning – hur och varfor?",a:"Rakna andetag/minut (12-20 = normalt) i 1 minut utan att patienten vet. Observera djup, rytm, ljud. Avvikelser kan tyda pa infektion, hjartsvikt eller KOL-forsamring."},
    {q:"Forklara temperaturmatning – hur och varfor?",a:"Mat med termometer (ora, panna, axill, rektalt). Normal: 36.5-37.5 C. Feber >38 C kan tyda pa infektion. Hypotermi <35 C. Dokumentera matmetod och varde."},
    {q:"Forklara pulskontroll – hur och varfor?",a:"Palpera radialispuls (handleden) i 1 minut. Normal: 60-100 slag/min. Notera frekvens, rytm och styrka.\n>> Bradykardi: <60\n>> Takykardi: >100\n>> Oregelbunden = arytmi"},
    {q:"Forklara blodtrycksmatning – hur och varfor?",a:"Manschett pa overarmen, arm i hjartniva, sitter still 5 min. Normal: systoliskt 90-140, diastoliskt 60-90 mmHg.\nHypertoni: >140/90\nHypotoni: <90/60\nMat bada armarna initialt, dokumentera vilken arm."},
    {q:"Forklara urinprov och blodprov.",a:"Urinprov: mitstral eprov – rengor, lat forsta urinen rinna, samla mitt-urinen. Kontrollerar nitrater, leukocyter, protein, glukos.\nKapillart blodprov: stickprov i fingertoppar – ex. P-glukos, Hb.\nVenost: nal i ven – CRP, blodstatus, elektrolyter. Mer blod, mer analyser."},
    {q:"Vad ar vitala parametrar och NEWS2?",a:"Vitala parametrar: andning, puls, blodtryck, temperatur, saturation, medvetandegrad.\nNEWS2: poangsystem for tidigt identifiera forsamring. Varje parameter ger poang – hog totalpoang = larm och snabb atgard."},
    {q:"Hur beskriver man smarta och vilka fragor bor du stalla?",a:"Fragor: Var? Hur lange? Vad utloser/lindrar? Hur intensivt (0-10)?\nBeskrivningar: brannande, stickande, dunkande, molande, krampaktig, utstraland e.\nObjektiva tecken: ansiktsgrimaser, spanning, okad puls, svettig, blek.\nLindring: lakemedel, lageskandring, varme/kyla, massage, samtal."},
    {q:"Vilka lagar styr dokumentationen och varfor dokumentera?",a:"Lagar: Patientdatalagen (PDL), HSL, Patientsaakerhetslagen.\nVarfor dokumentera:\n>> Patientsakerhet och kontinuitet\n>> Rattslig sakerhet for personal\n>> Underlag for uppfoljning och kvalitet\n>> Kommunikation mellan vardgivare"},
    {q:"Vad innebar SBAR? Ge exempel.",a:"Strukturerat kommunikationsverktyg:\nS – Situation: 'Patient X har feber 39.5 sedan 2h'\nB – Bakgrund: 'KOL-patient, brukar vara pigg'\nA – Bedomning: 'Misstanker pneumoni'\nR – Rekommendation: 'Behoover lakarbedomning och ev. antibiotika'"},
    {q:"Vad kan symtomen ikterisk, cyanos och rodnad tyda pa?",a:"Ikterisk (gul hud/ogon): leverproblem, gallvagshinder, hemolys.\nCyanos (blaaktig hud/lappar): lag syresaturation, hjart-/lungproblem.\nRodnad: feber, inflammation, infektion, allergisk reaktion."},
    {q:"Vilka observationer kan du gora av huden?",a:"Farg (rodnad, blekhet, cyanos, ikterus), temperatur, fuktighet, turgor (elasticitet), sar/utslag/hematom, klada, svullnad. Dokumentera lage, storlek och utseende."},
  ],
  "DEL 4: REHAB": [
    {q:"Ge exempel pa hjalmedel vid synproblem och horselnedsattning.",a:"Syn: forstoringsglasogon, talbok, punktskrift, kappvit, ledarhund, forstorande program.\nHorsel: horapparat, teleslinga, bildtelefon, vibrerande vackarklocka.\nRengora horapparat: torka med mjuk trasa, rengors ljudkanalen med borste, byt batteri. Aldrig i vatten!"},
    {q:"Ge exempel pa forflyttningshjalmedel.",a:">> Kapp, krycka, rollator, rullstol, elrullstol\n>> Glidbrada, glidlakan, vandskiva\n>> Lyft: taklift och golvlift\n>> Forflyttningsbalt e"},
    {q:"Vad ar syftet med rehabilitering vs habilitering? Egenvard och empowerment?",a:"Rehabilitering: aterfa forlorad funktion efter sjukdom/skada.\nHabilitering: hjalpa dem som aldrig haft en funktion att naa basta formaga.\nEgenvard: atgarder patienten gor sjalv pa lakares ordination.\nEmpowerment: starka individens tro pa sin egen kraft att paverka sin situation."},
    {q:"Forklara de fyra typerna av rehabilitering.",a:"Arbets-/yrkesinriktad: aterga till arbete, omskolning, arbetsanpassning.\nPsykologisk/psykiatrisk: samtal, KBT, behandling av psykisk ohalsa.\nSocial: aterfa social formaga, boende, relationer, delaktighet i samhallet.\nMedicinsk: behandla sjukdom/skada, traning, hjalmedel."},
    {q:"Ge exempel pa statliga myndigheter inom rehabilitering.",a:">> Forsakringskassan – samordnar rehab och sjukforsakring\n>> Arbetsformedlingen – arbetslivsinriktad rehab\n>> Socialstyrelsen – kunskapsstyrning\n>> Myndigheten for delaktighet"},
    {q:"Forklara: medfod hjarn skada, forvarvad hjarn skada, roreselnedsattning, AST.",a:"Medfod hjarn skada: ex. CP (cerebral pares) – uppstar fore/under/strax efter fodseln.\nForvarvad: stroke, trauma, syrebrist – uppstar efter normal utveckling.\nRorelsenedsattning: nedsatt formaga att rora/kontrollera kroppen.\nAST: Autismspektrum tillstand – varierad social kommunikation och begransade/repetitiva beteenden."},
    {q:"Vad innebar SIP?",a:"Samordnad individuell plan – upprattas nar en person behover insatser fran bade socialtjanst och halso-/sjukvard. Koordinerar insatserna, klargar ansvarsfordelning. Gors TILLSAMMANS med personen sa att hen inte hamnar mellan stolarna."},
    {q:"Vad star L-ABCDE for och hur kontrollerar du hjarna, hjarta och lungor?",a:"L – Livsfarlig blodning\nA – Airway (luftvag)\nB – Breathing (andning)\nC – Circulation (cirkulation)\nD – Disability (medvetande/neurologi)\nE – Exposure (helhetsbild)\n\nHjarna: medvetandegrad, pupiller, motorik.\nHjarta: puls, blodtryck, kapillar aterfy llnad.\nLungor: andningsfrekvens, saturation, andningsljud."},
    {q:"Vad innebar chock och hur hanterar du blodning?",a:"Chock: otillracklig organperfusion – blek, kallsvettig, snabb svag puls, lag blodtryck, forvirring.\nBlodning:\n>> Liten: tryck direkt mot saret\n>> Mattlig: tryckforband, hoj extremiteten\n>> Livshotande: ring 112, tourniquet vid extremitetsblodning"},
  ]
};

let status={}, currentPart=Object.keys(data)[0], currentFilter='all';
try{const s=localStorage.getItem('rv_retro');if(s)status=JSON.parse(s);}catch(e){}
function save(){try{localStorage.setItem('rv_retro',JSON.stringify(status));}catch(e){}}

function updateStats(){
  let total=0,know=0,review=0;
  Object.keys(data).forEach(p=>data[p].forEach((_,i)=>{
    total++;const k=p+'|'+i;
    if(status[k]==='know')know++;
    if(status[k]==='review')review++;
  }));
  document.getElementById('stat-total').textContent=total;
  document.getElementById('stat-know').textContent=know;
  document.getElementById('stat-review').textContent=review;
  const pct=total>0?Math.round((know/total)*100):0;
  document.getElementById('prog-fill').style.width=pct+'%';
  document.getElementById('prog-text').textContent=pct+'% ['+know+'/'+total+']';
}

function setFilter(f,el){
  currentFilter=f;
  document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  renderQuestions();
}

function toggleAnswer(id){
  const ans=document.getElementById('ans-'+id);
  const btn=document.getElementById('btn-'+id);
  const mr=document.getElementById('mr-'+id);
  const open=ans.classList.contains('visible');
  ans.classList.toggle('visible',!open);
  btn.textContent=open?'[ VISA SVAR ]':'[ DOLJ SVAR ]';
  mr.style.display=open?'none':'grid';
}

function markQ(part,i,val){
  const key=part+'|'+i;
  status[key]=status[key]===val?null:val;
  save();
  const pk=part.replace(/\W/g,'')+i;
  const kb=document.getElementById('mk-know-'+pk);
  const rb=document.getElementById('mk-rev-'+pk);
  if(kb)kb.classList.toggle('active',status[key]==='know');
  if(rb)rb.classList.toggle('active',status[key]==='review');
  updateStats();
  if(currentFilter!=='all')renderQuestions();
}

function renderTabs(){
  const row=document.getElementById('tab-row');
  row.innerHTML='';
  Object.keys(data).forEach(part=>{
    const btn=document.createElement('button');
    btn.className='tab'+(part===currentPart?' active':'');
    btn.textContent=part;
    btn.onclick=()=>{currentPart=part;renderTabs();renderQuestions();};
    row.appendChild(btn);
  });
}

function renderQuestions(){
  const container=document.getElementById('questions-container');
  const questions=data[currentPart];
  const pKey=currentPart.replace(/\W/g,'');
  let filtered=questions.map((q,i)=>({...q,i})).filter(({i})=>{
    const key=currentPart+'|'+i;
    if(currentFilter==='know')return status[key]==='know';
    if(currentFilter==='review')return status[key]==='review';
    if(currentFilter==='unmarked')return !status[key];
    return true;
  });
  if(filtered.length===0){
    container.innerHTML='<div class="empty">>> INGA FRAGOR MATCHAR <<</div>';
    return;
  }
  container.innerHTML=filtered.map(({q,a,i})=>{
    const key=currentPart+'|'+i;
    const pk=pKey+i;
    const isKnow=status[key]==='know';
    const isRev=status[key]==='review';
    const badge=isKnow?' <span class="badge-know">[OK]</span>':isRev?' <span class="badge-rev">[!]</span>':'';
    const aFormatted=a.replace(/\n/g,'<br>');
    return `<div class="q-card">
      <div class="q-num">FRAGA ${i+1}/${questions.length}${badge}</div>
      <div class="q-text">${q}</div>
      <button class="reveal-btn" id="btn-${pk}" onclick="toggleAnswer('${pk}')">[ VISA SVAR ]</button>
      <div class="answer" id="ans-${pk}">${aFormatted}</div>
      <div class="mark-row" id="mr-${pk}" style="display:none">
        <button class="mbtn mbtn-know${isKnow?' active':''}" id="mk-know-${pk}" onclick="markQ('${currentPart}',${i},'know')">[OK] KAN DETTA</button>
        <button class="mbtn mbtn-rev${isRev?' active':''}" id="mk-rev-${pk}" onclick="markQ('${currentPart}',${i},'review')">[!] OVA MER</button>
      </div>
    </div>`;
  }).join('');
}

renderTabs();
renderQuestions();
updateStats();
</script>
</body>
</html>
